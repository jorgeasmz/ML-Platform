apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "model-service.name" . }}
  labels: {{- include "model-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels: {{- include "model-service.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "model-service.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Alive: the process answers at all.
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          # Ready: the model loaded. The root endpoint answers 200 either way, so
          # this reads the body rather than the status.
          readinessProbe:
            exec:
              command: {{- toYaml .Values.probes.readinessCommand | nindent 16 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.resources | nindent 12 }}
          # Kubernetes sends SIGTERM and removes the pod from the Service's
          # endpoints at the same time, and the second takes a moment to reach
          # every node. This pause keeps the pod answering while that propagates.
          #
          # Measured both ways on one node: a rolling update dropped nothing with
          # it and nothing without it, so it is not what makes that test pass
          # here. It is kept because the window it covers widens with the number
          # of nodes the change has to reach, which is the case the single-node
          # test cannot produce, and five seconds per removal costs nothing.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.drainSeconds }}"]
      terminationGracePeriodSeconds: {{ add .Values.drainSeconds 25 }}
